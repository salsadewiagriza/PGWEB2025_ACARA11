<!DOCTYPE html>
<html>
<head>
    <title>WEBGIS KESIAPSIAGAAN BENCANA GUNUNG MERAPI DI MAGELANG DAN SEKITARNYA</title>
    <meta charset="utf-8" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        /* ================= HEADER ================= */
        .title {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            z-index: 1000;
        }

        /* ================= MAP ================= */
        #map {
            width: 100%;
            height: calc(100vh - 70px);
            margin-top: 70px;
        }

        /* ================= LEGEND ================= */
        .legend {
            background: white;
            padding: 10px;
            line-height: 20px;
            color: #333;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.25);
            font-size: 14px;
        }

        .legend i {
            display: inline-block;
            margin-right: 8px;
        }

        .line {
            width: 26px;
            height: 4px;
        }
    </style>
</head>

<body>

<div class="title container-fluid text-center">
    WEBGIS KESIAPSIAGAAN BENCANA GUNUNG MERAPI DI MAGELANG DAN SEKITARNYA
</div>

<div id="map"></div>

<script>

// MAP
var map = L.map("map").setView([-7.47, 110.21], 11);


// BASEMAP
// 1. OpenStreetMap (Administrasi & Jalan)
var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);

// 2. Esri World Imagery (Analisis fisik, sungai, lereng)
var esriImagery = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19 }
);

// 3. Esri Topographic (Relief & konteks gunung api)
var esriTopo = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19 }
);

// WMS GEOSERVER
var kecamatan = L.tileLayer.wms("http://localhost:8080/geoserver/pg_web/wms", {
    layers: "pg_web:Magelang_Kecamatan",
    format: "image/png",
    transparent: true
}).addTo(map);

var jalan = L.tileLayer.wms("http://localhost:8080/geoserver/pg_web/wms", {
    layers: "pg_web:Magelang_Jalan",
    format: "image/png",
    transparent: true
}).addTo(map);

var sungai = L.tileLayer.wms("http://localhost:8080/geoserver/pg_web/wms", {
    layers: "pg_web:Magelang_Sungai",
    format: "image/png",
    transparent: true
}).addTo(map);


// GUNUNG MERAPI
var merapiCoord = [-7.5407, 110.4461];

var merapi = L.marker(merapiCoord).bindPopup(
    "<b>Gunung Merapi</b><br>" +
    "Gunung api aktif tipe stratovolcano"
);


// ZONA RAWAN BENCANA (ZRB) + POPUP
var zrb3 = L.circle(merapiCoord, {
    radius: 5000,
    color: "#ff0000",
    fillColor: "#ff0000",
    fillOpacity: 0.35
}).bindPopup(
    "<b>ZONA RAWAN BENCANA III (TINGGI)</b><hr>" +
    "Radius: ± 5 km<br>" +
    "Tingkat Bahaya: Tinggi<br>" +
    "Potensi Bahaya:<ul>" +
    "<li>Awan panas</li>" +
    "<li>Lava pijar</li>" +
    "<li>Guguran batu</li></ul>" +
    "<b>Rekomendasi:</b> Tidak layak huni"
);

var zrb2 = L.circle(merapiCoord, {
    radius: 10000,
    color: "#ff9900",
    fillColor: "#ff9900",
    fillOpacity: 0.30
}).bindPopup(
    "<b>ZONA RAWAN BENCANA II (SEDANG)</b><hr>" +
    "Radius: ± 10 km<br>" +
    "Tingkat Bahaya: Sedang<br>" +
    "Potensi Bahaya:<ul>" +
    "<li>Lahar hujan</li>" +
    "<li>Hujan abu lebat</li></ul>" +
    "<b>Rekomendasi:</b> Waspada & siap evakuasi"
);

var zrb1 = L.circle(merapiCoord, {
    radius: 15000,
    color: "#ffff00",
    fillColor: "#ffff00",
    fillOpacity: 0.25
}).bindPopup(
    "<b>ZONA RAWAN BENCANA I (RENDAH)</b><hr>" +
    "Radius: ± 15 km<br>" +
    "Tingkat Bahaya: Rendah<br>" +
    "Potensi Bahaya:<ul>" +
    "<li>Hujan abu vulkanik</li></ul>" +
    "<b>Rekomendasi:</b> Tetap waspada"
);

// LAYER CONTROL
L.control.layers(
    {
        "OpenStreetMap": osm,
        "Esri World Imagery": esriImagery,
        "Esri Topographic": esriTopo
    },
    {
        "Kecamatan": kecamatan,
        "Jaringan Jalan": jalan,
        "Sungai": sungai,
        "Gunung Merapi": merapi,
        "ZRB III (Tinggi)": zrb3,
        "ZRB II (Sedang)": zrb2,
        "ZRB I (Rendah)": zrb1
    }
).addTo(map);

// LEGEND
var legend = L.control({ position: "bottomleft" });

legend.onAdd = function () {
    var div = L.DomUtil.create("div", "legend");

    div.innerHTML += "<b>LEGENDA</b><br><br>";
    div.innerHTML += "<b>Zona Rawan Bencana</b><br>";
    div.innerHTML += '<i class="line" style="background:#ff0000"></i> ZRB III (Tinggi)<br>';
    div.innerHTML += '<i class="line" style="background:#ff9900"></i> ZRB II (Sedang)<br>';
    div.innerHTML += '<i class="line" style="background:#ffff00"></i> ZRB I (Rendah)<br><br>';
    div.innerHTML += '<img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" width="12"> Gunung Merapi';

    return div;
};

legend.addTo(map);
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
